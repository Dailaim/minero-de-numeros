name: Regenerar Javadoc

# Solo se ejecuta manualmente desde la pestaña Actions -> "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  javadoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generar Javadoc
        run: mvn -B javadoc:javadoc

      - name: Copiar docs a la carpeta javadoc/
        run: |
          SRC=target/reports/apidocs
          [ -d "$SRC" ] || SRC=target/site/apidocs
          rm -rf javadoc
          cp -r "$SRC" javadoc

      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add javadoc
          if git diff --cached --quiet; then
            echo "La documentación ya estaba al día."
          else
            git commit -m "docs: regenerar Javadoc"
            git push
          fi
